name: 'TP_dbt'
version: '1.0.0'
config-version: 2

profile: 'TP_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  TP_dbt:
    +materialized: view
    staging:
      bronze:
        +schema: bronze
      silver:
        +schema: silver
      gold:
        +schema: gold
        +materialized: table
      training:
        +schema: TRAINING
        +materialized: table

vars:
  eur_rate_us: 0.8906
  eur_rate_uk: 1.1777
  eur_rate_india: 0.00926

